name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run benchmark
        env:
          BENCHMARK_ROUNDS: '1'
      - run: npm pack --dry-run

  metadata:
    name: Distribution metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all public descriptors use the package version
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const packageVersion = JSON.parse(fs.readFileSync('package.json')).version;
          const serverVersion = JSON.parse(fs.readFileSync('server.json')).version;
          const manifestVersion = JSON.parse(fs.readFileSync('manifest.json')).version;
          const packageEntry = JSON.parse(fs.readFileSync('server.json')).packages[0].version;
          if (new Set([packageVersion, serverVersion, manifestVersion, packageEntry]).size !== 1) process.exit(1);
          if (packageVersion !== '2.0.0') process.exit(1);
