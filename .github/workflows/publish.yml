name: Publish GitHub release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Verify, package, and create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Verify tag and descriptors
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"
          test "$(node -p "require('./server.json').version")" = "${version}"
          test "$(node -p "require('./manifest.json').version")" = "${version}"
      - name: Build release artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          git archive --format=tar.gz --prefix="enigmagent-mcp-${GITHUB_REF_NAME#v}/" "${GITHUB_REF_NAME}" -o "dist/enigmagent-mcp-${GITHUB_REF_NAME#v}-source.tar.gz"
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "enigmagent-mcp ${GITHUB_REF_NAME#v}"
